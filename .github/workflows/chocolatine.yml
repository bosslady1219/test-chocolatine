name: Chocolatine

on:
  push:
  pull_request:
    types: [opened]

env:
  MIRROR_SSH_URL: "git@git.epitech.eu:/..."
  EXECUTABLES: "mon_executable"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.ref_name }}" == no-ga/* ]] || [[ "$MIRROR_SSH_URL" == *"${{ github.repository }}"* ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  check_compilation_and_coding_style:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run banana-check-repo
        run: banana-check-repo

      - name: Debug info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Repository: ${{ github.repository }}"